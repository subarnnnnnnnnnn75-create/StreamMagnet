name: stream_magnet
description: "A cross-platform torrent streaming app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  crypto: ^3.0.7
  uuid: ^4.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  mime: ^2.1.0
  connectivity_plus: ^7.3.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_inappwebview: ^6.1.5
  file_picker: ^13.1.0
  google_fonts: ^8.2.1
  sqflite: ^2.4.4+2
  path: ^1.9.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.15.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
